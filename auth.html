<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - hanazawa-y</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="background"></div>

    <main class="auth-page">

        <section class="auth-card">

            <p class="hero-top">
                PRIVATE AREA
            </p>

            <h1>
                Login
            </h1>

            <p class="auth-lead">
                ログインIDとパスワードでログインしてください。
            </p>

            <form id="authForm" class="auth-form">

                <label for="loginId">
                    Login ID
                </label>
                <input id="loginId" type="text" autocomplete="username" required>

                <label for="password">
                    Password
                </label>
                <input id="password" type="password" autocomplete="current-password" required>

                <div class="auth-actions">
                    <button id="signInButton" type="submit">
                        ログイン
                    </button>
                </div>

            </form>

            <p id="authMessage" class="auth-message" aria-live="polite"></p>

        </section>

    </main>

    <script type="module" src="./src/auth.js"></script>

</body>

</html>
